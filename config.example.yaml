# 세 기능이 공통으로 사용할 Discord 봇과 포럼 목록입니다.
discord:
  token: ""
  forum_channel_ids: []  # 포럼 채널 우클릭 → 채널 ID 복사. 최소 1개 필요

slack:
  bot_token: ""   # 메시지 전송 및 Slack 앱 인증
  app_token: ""   # /table_update 수신용 Socket Mode (connections:write)
  user_token: ""  # List API용. 비우면 bot_token 사용

# 새 Discord 포럼 글을 Slack 채널에 알립니다.
notifications:
  enabled: true
  channel_id: ""

# 새 글 생성 또는 /table_update 시 미해결 글로 Slack List를 재작성합니다.
# 기존 assign 값은 백업·복원하며, 새 글의 assign은 빈칸입니다.
table_sync:
  enabled: true
  list_id: ""

# 위 트리거 시 마지막 사람 답변이 ROBOTIS이고 14일 이상 무응답이면 완료합니다.
# 각 포럼에서 역할과 태그를 이름으로 찾으므로 여러 포럼에서 함께 동작합니다.
auto_solve:
  enabled: false
  inactive_days: 14
  robotis_role_name: "ROBOTIS"
  solved_tag_name: "Solved"  # ✅Solved도 인식
